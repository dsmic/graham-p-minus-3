name = "GrahamPM"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GrahamPM"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
weak.linter.style.header = false # no Mathlib-style copyright headers required

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "GrahamPM"
